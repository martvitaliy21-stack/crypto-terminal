name: update terminal data and paper bot
on:
  schedule:
    - cron: "*/10 * * * *"   # страховка: если цепочка прогонов оборвалась, перезапустит; пока цикл идёт — просто ждёт в очереди
  workflow_dispatch:
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # прогон мог ждать в очереди часами — берём свежий main, а не коммит на момент постановки
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: live loop (бот и Telegram раз в минуту, сайт раз в 30 минут)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CODE: ${{ secrets.TELEGRAM_OWNER_CODE }}
          GH_TOKEN: ${{ github.token }}
        run: ./live.sh
