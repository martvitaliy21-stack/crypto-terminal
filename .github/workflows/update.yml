name: update terminal data and paper bot
on:
  schedule:
    - cron: "7,37 * * * *"   # каждые 30 минут (GitHub может задерживать на 5–20 минут — бот это переживает)
  workflow_dispatch:
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: paper bot
        run: python bot_sim.py
      - name: terminal data
        run: python analyze.py || echo "analyze failed, keeping previous data.json"
      - name: commit and push (with retry)
        run: |
          git config user.name "grosh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/bot/state.json
          git diff --cached --quiet && exit 0
          git commit -m "update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase -X theirs && sleep 5
          done
          exit 1
