name: update terminal data and paper bot
on:
  schedule:
    - cron: "7,37 * * * *"   # каждые 30 минут (GitHub может задерживать на 5–20 минут — бот это переживает)
  workflow_dispatch:
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: paper bot
        run: python bot_sim.py
      - name: telegram signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CODE: ${{ secrets.TELEGRAM_OWNER_CODE }}
        run: python tg_bot.py || echo "telegram step failed"
      - name: terminal data
        run: python analyze.py || echo "analyze failed, keeping previous data.json"
      - name: world news
        run: python news.py || echo "news failed, keeping previous news.json"
      - name: commit and push (при конфликте пересчитать от свежего состояния)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CODE: ${{ secrets.TELEGRAM_OWNER_CODE }}
        run: |
          git config user.name "grosh-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4; do
            git add docs/data.json docs/bot/state.json docs/news.json signals/
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then exit 0; fi
            if git pull --rebase; then
              if git push; then exit 0; fi
            else
              git rebase --abort || true
              echo "conflict: беру свежее состояние из origin и пересчитываю (без повторной отправки в Telegram)"
              git fetch origin main
              git reset --hard origin/main
              python bot_sim.py
              TG_MODE=mark python tg_bot.py || true
              python analyze.py || true
              python news.py || true
            fi
            sleep 5
          done
          exit 1
